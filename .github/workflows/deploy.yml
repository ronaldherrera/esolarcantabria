name: Deploy eSolar Cantabria to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Si algo de esto falla, no se publica nada
      - name: Enlaces internos rotos
        run: npm run enlaces

      # rsync por SSH, igual que Tankily: una sola conexión, sube solo lo que cambia y borra lo que ya no existe.
      # config-correo.php está fuera de public_html, así que rsync nunca lo toca.
      - name: Deploy to Hostinger via rsync (SSH)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DESTINO: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_RUTA }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # --delete-delay: borra lo viejo al final, cuando ya está subido todo lo nuevo.
          # .well-known (certificados) no viene del build y no se toca.
          rsync -rlz --checksum --delete-delay --exclude '.well-known/' \
            -e "ssh -i ~/.ssh/deploy -p ${{ secrets.SSH_PORT }}" \
            ./dist/ "$DESTINO"
